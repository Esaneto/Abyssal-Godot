name: Godot Native Client Smoke

on:
  push:
    paths:
      - '**'
      - '.github/workflows/godot-native-smoke.yml'
  pull_request:
    paths:
      - '**'
      - '.github/workflows/godot-native-smoke.yml'
  workflow_dispatch:

jobs:
  godot-4-7:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download official Godot 4.7.2 stable
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.7.2-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --headless --version
      - name: Import project resources and parse scripts
        run: ./godot --headless --path . --editor --import
      - name: Verify cabin, ocean, diver and fauna
        run: ./godot --headless --path . --script res://scripts/ci_smoke.gd
      - name: Verify functional exploration parity and saved progress
        run: ./godot --headless --path . --script res://scripts/ci_functional_smoke.gd
      - name: Capture real Godot frames with virtual display
        continue-on-error: false
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri
          mkdir -p captures
          GODOT_CAPTURE_DIR="$PWD/captures" xvfb-run -a -s "-screen 0 1280x720x24" \
            ./godot --path . --rendering-driver opengl3 \
            --script res://scripts/ci_capture.gd 2>&1 | tee captures/render.log
          if grep -E 'Invalid polygon data|SCRIPT ERROR|Parse Error' captures/render.log; then
            echo "Native cinematic renderer reported a drawing/script error"
            exit 1
          fi
          test "$(find captures -maxdepth 1 -name '*.png' | wc -l)" -ge 10
          ls -lh captures
      - name: Store Godot visual comparison captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abyssal-godot-captures
          path: captures/*.png
          if-no-files-found: ignore
